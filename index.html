<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bug AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f0f);
      --secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2aabee);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #0066ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 18px;
    }

    .header-info h1 {
      font-size: 17px;
      font-weight: 600;
    }

    .header-info p {
      font-size: 12px;
      color: var(--hint);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 120px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 4px 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--secondary);
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .btn .icon {
      font-size: 22px;
      display: block;
      margin-bottom: 6px;
    }

    .btn .label {
      font-size: 14px;
      font-weight: 600;
      display: block;
    }

    .btn .desc {
      font-size: 11px;
      color: var(--hint);
      margin-top: 2px;
    }

    .full {
      grid-column: span 2;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 12px 14px 24px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: var(--secondary);
      border: none;
      border-radius: 24px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: var(--hint);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--button);
      border: none;
      color: var(--button-text);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">B</div>
    <div class="header-info">
      <h1>Bug</h1>
      <p>Personal AI Assistant</p>
    </div>
  </div>

  <div class="content">

    <!-- Creative -->
    <div class="section">
      <div class="section-title">Creative Tools</div>
      <div class="grid">
        <button class="btn" onclick="send('/draw ')">
          <span class="icon">🎨</span>
          <span class="label">Create Image</span>
          <span class="desc">/draw ...</span>
        </button>
        <button class="btn" onclick="send('/edit ')">
          <span class="icon">🖌</span>
          <span class="label">Edit Photo</span>
          <span class="desc">/edit ...</span>
        </button>
        <button class="btn" onclick="send('/search ')">
          <span class="icon">🔎</span>
          <span class="label">Web Search</span>
          <span class="desc">/search ...</span>
        </button>
        <button class="btn" onclick="send('/ask ')">
          <span class="icon">📄</span>
          <span class="label">Ask about PDF</span>
          <span class="desc">/ask ...</span>
        </button>
      </div>
    </div>

    <!-- Reminders -->
    <div class="section">
      <div class="section-title">Reminders</div>
      <div class="grid">
        <button class="btn" onclick="send('/remind ')">
          <span class="icon">⏰</span>
          <span class="label">Set Reminder</span>
          <span class="desc">/remind 30m ...</span>
        </button>
        <button class="btn" onclick="send('/reminders')">
          <span class="icon">📋</span>
          <span class="label">My Reminders</span>
          <span class="desc">List all</span>
        </button>
        <button class="btn full" onclick="send('/delremind ')">
          <span class="icon">🗑</span>
          <span class="label">Delete Reminder</span>
          <span class="desc">/delremind number</span>
        </button>
      </div>
    </div>

    <!-- Voice -->
    <div class="section">
      <div class="section-title">Voice</div>
      <div class="grid">
        <button class="btn" onclick="send('/voice on')">
          <span class="icon">🔊</span>
          <span class="label">Voice On</span>
          <span class="desc">Enable voice replies</span>
        </button>
        <button class="btn" onclick="send('/voice off')">
          <span class="icon">🔇</span>
          <span class="label">Voice Off</span>
          <span class="desc">Disable voice</span>
        </button>
        <button class="btn full" onclick="send('/say ')">
          <span class="icon">🗣</span>
          <span class="label">Read Aloud</span>
          <span class="desc">/say your text</span>
        </button>
      </div>
    </div>

    <!-- Admin -->
    <div class="section">
      <div class="section-title">Admin Panel</div>
      <div class="grid">
        <button class="btn" onclick="send('/stats')">
          <span class="icon">📊</span>
          <span class="label">Stats</span>
          <span class="desc">Bot statistics</span>
        </button>
        <button class="btn" onclick="send('/users')">
          <span class="icon">👥</span>
          <span class="label">Users</span>
          <span class="desc">List all users</span>
        </button>
        <button class="btn" onclick="send('/banned')">
          <span class="icon">🚫</span>
          <span class="label">Banned</span>
          <span class="desc">Show banned list</span>
        </button>
        <button class="btn" onclick="send('/broadcast ')">
          <span class="icon">📣</span>
          <span class="label">Broadcast</span>
          <span class="desc">Message everyone</span>
        </button>
        <button class="btn full" onclick="send('/help')">
          <span class="icon">❓</span>
          <span class="label">All Commands</span>
          <span class="desc">Show full help</span>
        </button>
      </div>
    </div>

  </div>

  <div class="bottom">
    <div class="input-row">
      <input type="text" id="msg" placeholder="Type a message or command..." />
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function send(text) {
      if (!text) return;
      tg.sendData(text);
      tg.showAlert("Sent ✅\nCheck the chat for the reply");
      setTimeout(() => tg.close(), 700);
    }

    function sendMessage() {
      const text = document.getElementById("msg").value.trim();
      if (text) {
        send(text);
      } else {
        tg.showAlert("Please type something first");
      }
    }

    document.getElementById("msg").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
