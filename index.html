<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bug AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f0f);
      --secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2aabee);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #1e90ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white;
    }
    .content {
      flex: 1;
      padding: 20px 16px 130px;
      overflow-y: auto;
    }
    .welcome {
      text-align: center;
      margin-bottom: 24px;
    }
    .welcome h2 { font-size: 20px; margin-bottom: 6px; }
    .welcome p { color: var(--hint); font-size: 14px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-btn {
      background: var(--secondary);
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      font-size: 14px;
    }
    .action-btn:active { opacity: 0.75; }
    .action-btn .icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .action-btn b { display: block; margin-bottom: 2px; }
    .action-btn span { font-size: 12px; color: var(--hint); }
    .bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      padding: 12px 16px 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      background: var(--secondary);
      border: none;
      border-radius: 24px;
      padding: 13px 18px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    .send {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--button);
      border: none;
      color: var(--button-text);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">B</div>
    <div>
      <div style="font-weight:600">Bug</div>
      <div style="font-size:12px;color:var(--hint)">Personal AI Assistant</div>
    </div>
  </div>

  <div class="content">
    <div class="welcome">
      <h2>How can I help you?</h2>
      <p>Everything is connected to the real AI</p>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="send('/draw ')">
        <span class="icon">🎨</span>
        <b>Create Image</b>
        <span>/draw ...</span>
      </button>
      <button class="action-btn" onclick="send('/search ')">
        <span class="icon">🔎</span>
        <b>Web Search</b>
        <span>/search ...</span>
      </button>
      <button class="action-btn" onclick="send('/remind ')">
        <span class="icon">⏰</span>
        <b>Reminder</b>
        <span>/remind ...</span>
      </button>
      <button class="action-btn" onclick="send('/voice on')">
        <span class="icon">🔊</span>
        <b>Voice On</b>
        <span>Enable voice</span>
      </button>
      <button class="action-btn" onclick="send('/edit ')">
        <span class="icon">🖌</span>
        <b>Edit Photo</b>
        <span>/edit ...</span>
      </button>
      <button class="action-btn" onclick="send('/help')">
        <span class="icon">❓</span>
        <b>Help</b>
        <span>All commands</span>
      </button>
    </div>
  </div>

  <div class="bottom">
    <div class="row">
      <input type="text" id="msg" placeholder="Message Bug..." />
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function send(text) {
      tg.sendData(text);
    }

    function sendMessage() {
      const text = document.getElementById("msg").value.trim();
      if (text) {
        tg.sendData(text);
      }
    }

    document.getElementById("msg").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
