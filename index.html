<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bug • AI Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f0f);
      --secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2aabee);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #1e90ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white; font-size: 18px;
    }

    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; color: var(--hint); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 110px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome h2 { font-size: 20px; margin-bottom: 6px; }
    .welcome p { font-size: 14px; color: var(--hint); line-height: 1.4; }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 4px 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .action-btn {
      background: var(--secondary);
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }

    .action-btn:active { transform: scale(0.97); opacity: 0.85; }

    .action-btn .icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .action-btn .label { font-size: 14px; font-weight: 600; display: block; }
    .action-btn .desc { font-size: 12px; color: var(--hint); margin-top: 2px; }

    .bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 12px 16px 22px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: var(--secondary);
      border: none;
      border-radius: 24px;
      padding: 13px 18px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .input-box::placeholder { color: var(--hint); }

    .send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--button);
      border: none;
      color: var(--button-text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    .hint-text {
      text-align: center;
      font-size: 11px;
      color: var(--hint);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">B</div>
    <div class="header-info">
      <h1>Bug</h1>
      <p>Your personal AI assistant</p>
    </div>
  </div>

  <div class="content">
    <div class="welcome">
      <h2>How can I help you?</h2>
      <p>Everything here is connected to the real AI.<br>Just type or tap a button.</p>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="actions">
      <button class="action-btn" onclick="sendToBot('/draw ')">
        <span class="icon">🎨</span>
        <span class="label">Create Image</span>
        <span class="desc">/draw ...</span>
      </button>

      <button class="action-btn" onclick="sendToBot('/search ')">
        <span class="icon">🔎</span>
        <span class="label">Web Search</span>
        <span class="desc">/search ...</span>
      </button>

      <button class="action-btn" onclick="sendToBot('/remind ')">
        <span class="icon">⏰</span>
        <span class="label">Set Reminder</span>
        <span class="desc">/remind ...</span>
      </button>

      <button class="action-btn" onclick="sendToBot('/voice on')">
        <span class="icon">🔊</span>
        <span class="label">Voice On</span>
        <span class="desc">Enable voice replies</span>
      </button>

      <button class="action-btn" onclick="sendToBot('/edit ')">
        <span class="icon">🖌</span>
        <span class="label">Edit Photo</span>
        <span class="desc">/edit ...</span>
      </button>

      <button class="action-btn" onclick="sendToBot('/help')">
        <span class="icon">❓</span>
        <span class="label">All Commands</span>
        <span class="desc">Show full help</span>
      </button>
    </div>
  </div>

  <div class="bottom">
    <div class="input-row">
      <input type="text" class="input-box" id="userInput" placeholder="Message Bug..." autocomplete="off" />
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint-text">Connected to your real AI assistant</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.enableClosingConfirmation();

    // Apply Telegram theme
    if (tg.themeParams.bg_color) {
      document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color);
      document.documentElement.style.setProperty('--secondary', tg.themeParams.secondary_bg_color || '#1c1c1e');
      document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#ffffff');
      document.documentElement.style.setProperty('--hint', tg.themeParams.hint_color || '#8e8e93');
      document.documentElement.style.setProperty('--button', tg.themeParams.button_color || '#2aabee');
      document.documentElement.style.setProperty('--button-text', tg.themeParams.button_text_color || '#ffffff');
    }

    function sendToBot(text) {
      // This is the correct way to send data to the bot
      tg.sendData(text);
    }

    function sendMessage() {
      const text = document.getElementById("userInput").value.trim();
      if (!text) return;
      tg.sendData(text);
    }

    // Enter key
    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
