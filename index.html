<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bug AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);--text:var(--tg-theme-text-color,#14181c);--hint:var(--tg-theme-hint-color,#76808a);
  --link:var(--tg-theme-link-color,#1b7fd1);--btn:var(--tg-theme-button-color,#1b7fd1);--btn-text:var(--tg-theme-button-text-color,#ffffff);
  --soft:var(--tg-theme-secondary-bg-color,#eff2f5);--line:color-mix(in srgb,var(--text) 12%,transparent);--radius:18px;
}
@media (prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#151c24);--text:var(--tg-theme-text-color,#eef1f4);--hint:var(--tg-theme-hint-color,#8795a3);--soft:var(--tg-theme-secondary-bg-color,#1f2a35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:var(--tg-viewport-height,100dvh);padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px 6px}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;font-size:13px;color:var(--hint)}
main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.panel.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;color:var(--hint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
nav button span{font-size:21px;line-height:1.2}
nav button.on{color:var(--btn);font-weight:600}
.btn{border:0;background:var(--btn);color:var(--btn-text);padding:12px 18px;border-radius:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn:disabled{opacity:.5}
.field{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;outline:none;resize:none}
.field:focus{border-color:var(--btn)}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.hint{color:var(--hint);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.msg{max-width:86%;padding:10px 14px;border-radius:var(--radius);margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto;background:var(--btn);color:var(--btn-text);border-bottom-right-radius:6px}
.msg.model{background:var(--soft);border-bottom-left-radius:6px}
.msg .say{display:block;margin-top:6px;border:0;background:none;color:var(--link);padding:0;font-size:13px;cursor:pointer}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--hint);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.empty{text-align:center;padding:36px 12px 8px}.empty h2{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px 10px;border-top:1px solid var(--line)}
.composer textarea{max-height:120px}
.frame{margin-top:14px;aspect-ratio:1/1;border-radius:var(--radius);background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--hint);text-align:center;padding:16px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.frame img.ok{opacity:1}
.hit{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hit img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.hit h3{margin:0 0 3px;font-size:16px}.hit p{margin:0;font-size:14px;color:var(--hint)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:.92}
</style>
</head>
<body>
<div id="app">
  <header><h1>Bug AI</h1><p id="sub">Same brain, memory and settings as your bot</p></header>
  <main>
    <section class="panel on" id="p-chat">
      <div class="scroll" id="log"></div>
      <div class="composer"><textarea class="field" id="msg" rows="1" placeholder="Ask anything"></textarea><button class="btn" id="send">Send</button></div>
    </section>
    <section class="panel" id="p-draw"><div class="scroll">
      <textarea class="field" id="prompt" rows="3" placeholder="Describe the image you want"></textarea>
      <div class="chips" id="styles"></div>
      <div class="row"><button class="btn" id="go" style="flex:1">Create image</button><button class="btn ghost" id="again" disabled>New version</button></div>
      <div class="frame" id="frame"><span>Your image will appear here</span><img id="out" alt="Generated image"></div>
      <div class="row"><button class="btn ghost" id="open" style="flex:1" disabled>Open full size</button></div>
    </div></section>
    <section class="panel" id="p-search"><div class="scroll">
      <div class="row" style="margin-top:0"><input class="field" id="q" placeholder="Search Wikipedia" enterkeyhint="search"><button class="btn" id="find">Search</button></div>
      <div id="hits"><p class="hint" style="margin-top:14px">Type a topic to see short summaries with links.</p></div>
    </div></section>
    <section class="panel" id="p-voice"><div class="scroll">
      <textarea class="field" id="say" rows="6" placeholder="Type text to hear it read aloud"></textarea>
      <div class="row"><button class="btn" id="play" style="flex:1">Play here</button><button class="btn ghost" id="tochat" style="flex:1">Send to chat</button></div>
      <p class="hint" style="margin-top:12px">Reads about 500 characters. Russian, English, Persian and Arabic are detected automatically. If Play here is silent, use Send to chat.</p>
    </div></section>
  </main>
  <nav>
    <button data-t="chat" class="on"><span>💬</span>Chat</button>
    <button data-t="draw"><span>🎨</span>Draw</button>
    <button data-t="search"><span>🔎</span>Search</button>
    <button data-t="voice"><span>🔊</span>Voice</button>
  </nav>
</div>
<audio id="player" playsinline></audio>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var API = "https://webapp.telebothost.com/ownlang/webapp/235772776008363/miniapi";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
var $ = function(s){ return document.querySelector(s); };
function tap(){ try { tg.HapticFeedback.impactOccurred("light"); } catch(e){} }
function toast(t){ var el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(function(){ el.classList.remove("on"); }, 3000); }
function openUrl(u){ try { tg.openLink(u); } catch(e){ window.open(u, "_blank"); } }

/* talk to the bot server (same memory, rules and API key as the bot) */
function call(cmd, text){
  var d = tg && tg.initData ? tg.initData : "";
  if (!d) return Promise.reject(new Error("telegram"));
  var url = API + "?c=" + encodeURIComponent(cmd) + "&t=" + encodeURIComponent(String(text || "").substring(0, 1200)) + "&d=" + encodeURIComponent(d);
  var ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if (ctl) ctl.abort(); }, 60000);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){ clearTimeout(to); return r.json(); });
}
function why(e){
  if (e && e.message === "telegram") return "Open this app inside Telegram.";
  return "Could not reach the bot server. Check your internet, then try again.";
}

var tabs = document.querySelectorAll("nav button");
tabs.forEach(function(b){
  b.addEventListener("click", function(){
    tap();
    tabs.forEach(function(x){ x.classList.toggle("on", x === b); });
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.toggle("on", p.id === "p-" + b.dataset.t); });
  });
});

/* audio */
var player = $("#player");
var SILENT = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
function unlock(){ try { player.src = SILENT; var p = player.play(); if (p && p.catch) p.catch(function(){}); } catch(e){} }
function playChunks(list){
  var i = 0;
  function next(){
    if (i >= list.length) return;
    player.src = "data:audio/mpeg;base64," + list[i++];
    player.onended = next;
    var p = player.play();
    if (p && p.catch) p.catch(function(){ toast("Could not play here. Use Send to chat."); });
  }
  next();
}
function playText(text){
  text = String(text || "").trim();
  if (!text) { toast("Write something first"); return; }
  unlock(); tap(); toast("Preparing voice...");
  call("say", text).then(function(j){
    if (j && j.ok && j.audio && j.audio.length) playChunks(j.audio);
    else toast("Voice is not available here. Use Send to chat.");
  }).catch(function(e){ toast(why(e)); });
}
$("#play").onclick = function(){ playText($("#say").value); };
$("#tochat").onclick = function(){
  var t = $("#say").value.trim();
  if (!t) { toast("Write something first"); return; }
  tap(); toast("Sending voice message...");
  call("saychat", t).then(function(j){ toast(j && j.ok ? "Sent. Check your bot chat." : ((j && j.error) || "Could not send")); }).catch(function(e){ toast(why(e)); });
};

/* chat */
var hist = [], busy = false, log = $("#log");
function bubble(role, text){
  var d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
  if (role === "model") {
    var s = document.createElement("button"); s.className = "say"; s.textContent = "Listen";
    s.onclick = function(){ playText(text); };
    d.appendChild(s);
  }
  return d;
}
function renderLog(){
  log.innerHTML = "";
  if (!hist.length) {
    var name = ""; try { name = tg.initDataUnsafe.user.first_name; } catch(e){}
    var e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "<h2></h2><p class='hint'>Ask a question, or start with an idea.</p><div class='chips' style='justify-content:center'></div>";
    e.querySelector("h2").textContent = name ? "Hi " + name : "Hi there";
    ["Explain a topic simply", "Help me plan my day", "Give me a quick quiz"].forEach(function(t){
      var c = document.createElement("button"); c.className = "chip"; c.textContent = t;
      c.onclick = function(){ $("#msg").value = t; sendMsg(); };
      e.querySelector(".chips").appendChild(c);
    });
    log.appendChild(e); return;
  }
  hist.forEach(function(m){ log.appendChild(bubble(m.role, m.text)); });
  log.scrollTop = log.scrollHeight;
}
function sendMsg(){
  var input = $("#msg"), text = input.value.trim();
  if (!text || busy) return;
  tap(); input.value = ""; input.style.height = "auto";
  hist.push({ role: "user", text: text }); renderLog();
  var wait = document.createElement("div"); wait.className = "msg model"; wait.innerHTML = "<span class='dots'><i></i><i></i><i></i></span>";
  log.appendChild(wait); log.scrollTop = log.scrollHeight;
  busy = true; $("#send").disabled = true;
  call("chat", text).then(function(j){
    hist.push({ role: "model", text: (j && j.ok) ? j.reply : ((j && j.error) || "Something went wrong. Try again.") });
  }).catch(function(e){
    hist.push({ role: "model", text: why(e) });
  }).then(function(){ busy = false; $("#send").disabled = false; renderLog(); });
}
$("#send").onclick = sendMsg;
$("#msg").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches) { e.preventDefault(); sendMsg(); }
});
$("#msg").addEventListener("input", function(){ this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px"; });
renderLog();
call("hist", "").then(function(j){
  if (j && j.ok && j.hist && j.hist.length && !hist.length) { hist = j.hist; renderLog(); }
  if (j && j.ok && j.auth === "soft") $("#sub").textContent = "Connected (unverified mode)";
}).catch(function(){});

/* draw */
var STYLES = [["Any style",""],["Realistic",", photorealistic, natural light, high detail"],["Cartoon",", cartoon illustration, bold outlines, bright colors"],["Watercolor",", soft watercolor painting"],["3D render",", 3D render, soft studio lighting"],["Diagram",", clean educational diagram, labeled, white background"]];
var styleIdx = 0, lastUrl = "";
STYLES.forEach(function(s, i){
  var c = document.createElement("button"); c.className = "chip" + (i === 0 ? " on" : ""); c.textContent = s[0];
  c.onclick = function(){ styleIdx = i; document.querySelectorAll("#styles .chip").forEach(function(x, j){ x.classList.toggle("on", j === i); }); };
  $("#styles").appendChild(c);
});
function draw(){
  var p = $("#prompt").value.trim();
  if (!p) { toast("Describe the image first"); return; }
  tap();
  lastUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p + STYLES[styleIdx][1]) + "?width=1024&height=1024&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
  var img = $("#out"), hint = $("#frame span");
  img.classList.remove("ok"); hint.style.display = ""; hint.textContent = "Creating your image, this can take up to 30 seconds";
  $("#go").disabled = true; $("#again").disabled = true; $("#open").disabled = true;
  img.onload = function(){ img.classList.add("ok"); hint.style.display = "none"; $("#go").disabled = false; $("#again").disabled = false; $("#open").disabled = false; };
  img.onerror = function(){ hint.textContent = "The image could not be created. Tap Create image to try again."; $("#go").disabled = false; $("#again").disabled = false; };
  img.src = lastUrl;
}
$("#go").onclick = draw; $("#again").onclick = draw;
$("#open").onclick = function(){ if (lastUrl) openUrl(lastUrl); };

/* search (Wikipedia) */
function find(){
  var q = $("#q").value.trim(), box = $("#hits");
  if (!q) return;
  tap(); box.innerHTML = "<p class='hint' style='margin-top:14px'>Searching...</p>";
  var url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=8&gsrsearch=" + encodeURIComponent(q) +
    "&prop=extracts%7Cpageimages%7Cinfo&exintro=1&explaintext=1&exsentences=3&exlimit=max&piprop=thumbnail&pithumbsize=160&inprop=url";
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var pages = j.query && j.query.pages ? Object.keys(j.query.pages).map(function(k){ return j.query.pages[k]; }) : [];
    pages.sort(function(a, b){ return a.index - b.index; });
    box.innerHTML = "";
    if (!pages.length) { box.innerHTML = "<p class='hint' style='margin-top:14px'>No results. Try different words.</p>"; return; }
    pages.forEach(function(p){
      var d = document.createElement("div"); d.className = "hit";
      if (p.thumbnail) { var im = document.createElement("img"); im.src = p.thumbnail.source; im.alt = ""; d.appendChild(im); }
      var t = document.createElement("div"), h = document.createElement("h3"), s = document.createElement("p");
      h.textContent = p.title; s.textContent = (p.extract || "").substring(0, 240);
      t.appendChild(h); t.appendChild(s); d.appendChild(t);
      d.onclick = function(){ openUrl(p.fullurl); };
      box.appendChild(d);
    });
  }).catch(function(){ box.innerHTML = "<p class='hint' style='margin-top:14px'>Search failed. Check your connection and try again.</p>"; });
}
$("#find").onclick = find;
$("#q").addEventListener("keydown", function(e){ if (e.key === "Enter") find(); });
})();
</script>
</body>
</html>
