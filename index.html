<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bug • AI Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f0f);
      --secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2aabee);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2aabee, #1e90ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: white; font-size: 18px;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; color: var(--hint); }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 120px;
    }
    .welcome { text-align: center; margin-bottom: 24px; }
    .welcome h2 { font-size: 20px; margin-bottom: 6px; }
    .welcome p { font-size: 14px; color: var(--hint); line-height: 1.4; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 4px 10px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-btn {
      background: var(--secondary);
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .action-btn:active { opacity: 0.8; transform: scale(0.97); }
    .action-btn .icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .action-btn .label { font-size: 14px; font-weight: 600; }
    .action-btn .desc { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 12px 16px 24px;
    }
    .input-row { display: flex; gap: 10px; align-items: center; }
    .input-box {
      flex: 1;
      background: var(--secondary);
      border: none;
      border-radius: 24px;
      padding: 13px 18px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    .input-box::placeholder { color: var(--hint); }
    .send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--button);
      border: none;
      color: var(--button-text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .hint-text {
      text-align: center;
      font-size: 11px;
      color: var(--hint);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">B</div>
    <div class="header-info">
      <h1>Bug</h1>
      <p>Your personal AI assistant</p>
    </div>
  </div>

  <div class="content">
    <div class="welcome">
      <h2>How can I help you?</h2>
      <p>Messages and buttons go to the real AI.<br>Reply will appear in the normal chat.</p>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="actions">
      <button class="action-btn" onclick="send('/draw ')">
        <span class="icon">🎨</span>
        <span class="label">Create Image</span>
        <span class="desc">/draw ...</span>
      </button>
      <button class="action-btn" onclick="send('/search ')">
        <span class="icon">🔎</span>
        <span class="label">Web Search</span>
        <span class="desc">/search ...</span>
      </button>
      <button class="action-btn" onclick="send('/remind ')">
        <span class="icon">⏰</span>
        <span class="label">Set Reminder</span>
        <span class="desc">/remind ...</span>
      </button>
      <button class="action-btn" onclick="send('/voice on')">
        <span class="icon">🔊</span>
        <span class="label">Voice On</span>
        <span class="desc">Enable voice</span>
      </button>
      <button class="action-btn" onclick="send('/edit ')">
        <span class="icon">🖌</span>
        <span class="label">Edit Photo</span>
        <span class="desc">/edit ...</span>
      </button>
      <button class="action-btn" onclick="send('/help')">
        <span class="icon">❓</span>
        <span class="label">All Commands</span>
        <span class="desc">Show help</span>
      </button>
    </div>
  </div>

  <div class="bottom">
    <div class="input-row">
      <input type="text" class="input-box" id="input" placeholder="Message Bug..." />
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint-text">Connected to the same AI system</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function send(text) {
      if (!text) return;
      tg.sendData(text);   // This is the correct way
    }

    function sendMessage() {
      const text = document.getElementById("input").value.trim();
      if (text) {
        tg.sendData(text);
      }
    }

    document.getElementById("input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
